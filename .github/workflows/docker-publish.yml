name: Build, Verify & Publish

on:
  push:
    tags:
      - "v[0-9]*.[0-9]*.[0-9]*"
      - "s[0-9]*.[0-9]*.[0-9]*"
  workflow_dispatch:

env:
  REGISTRY: ghcr.io

jobs:
  # ── Verify: Email API (email-server + email-ui) ─────────────────────────────
  verify-api:
    name: Verify API · ${{ matrix.name }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: email-server
            path: services/email-server
          - name: email-ui
            path: services/email-ui

    steps:
      - uses: actions/checkout@v4

      - name: Enable Corepack
        run: corepack enable

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: ${{ matrix.path }}/pnpm-lock.yaml

      - name: Install dependencies
        working-directory: ${{ matrix.path }}
        run: pnpm install --frozen-lockfile

      - name: Build
        working-directory: ${{ matrix.path }}
        run: pnpm run build

  # ── Verify: Inbox (inbox-server + inbox-ui) ─────────────────────────────────
  verify-inbox:
    name: Verify Inbox · ${{ matrix.name }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: inbox-ui
            path: services/inbox-ui
            emails_path: ""
          - name: inbox-server
            path: services/inbox-server
            emails_path: services/emails

    steps:
      - uses: actions/checkout@v4

      - name: Enable Corepack
        run: corepack enable

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: ${{ matrix.path }}/pnpm-lock.yaml

      - name: Build shared emails package
        if: matrix.emails_path != ''
        working-directory: ${{ matrix.emails_path }}
        run: |
          pnpm install
          pnpm run build

      - name: Install dependencies
        working-directory: ${{ matrix.path }}
        run: pnpm install --frozen-lockfile

      - name: Build
        working-directory: ${{ matrix.path }}
        run: pnpm run build

  # ── Docker: emailflare-api ───────────────────────────────────────────────────
  docker-api:
    name: Build emailflare-api image
    runs-on: ubuntu-latest
    needs: verify-api
    permissions:
      contents: read
      packages: write

    steps:
      - uses: actions/checkout@v4

      # s* tags → private staging package; v* tags → public production package
      - name: Resolve image name
        id: resolve
        run: |
          if [[ "${{ github.ref_name }}" =~ ^s[0-9] ]]; then
            echo "image=${{ env.REGISTRY }}/${{ github.repository_owner }}/emailflare-api-staging" >> $GITHUB_OUTPUT
            echo "is_staging=true" >> $GITHUB_OUTPUT
          else
            echo "image=${{ env.REGISTRY }}/${{ github.repository_owner }}/emailflare-api" >> $GITHUB_OUTPUT
            echo "is_staging=false" >> $GITHUB_OUTPUT
          fi

      - uses: docker/setup-qemu-action@v3

      - uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract Docker metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ steps.resolve.outputs.image }}
          tags: |
            type=semver,pattern=v{{version}},enable=${{ steps.resolve.outputs.is_staging == 'false' }}
            type=semver,pattern=v{{major}}.{{minor}},enable=${{ steps.resolve.outputs.is_staging == 'false' }}
            type=raw,value=latest,enable=${{ github.ref_type == 'tag' && steps.resolve.outputs.is_staging == 'false' }}
            type=raw,value=${{ github.ref_name }},enable=${{ steps.resolve.outputs.is_staging == 'true' }}

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile.email-api
          platforms: linux/amd64,linux/arm64
          push: ${{ github.ref_type == 'tag' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            MESAHUB_CORE_VERSION=trunk
          cache-from: type=gha,scope=api
          cache-to: type=gha,mode=max,scope=api

  # ── Docker: emailflare-inbox ─────────────────────────────────────────────────
  docker-inbox:
    name: Build emailflare-inbox image
    runs-on: ubuntu-latest
    needs: verify-inbox
    permissions:
      contents: read
      packages: write

    steps:
      - uses: actions/checkout@v4

      # s* tags → private staging package; v* tags → public production package
      - name: Resolve image name
        id: resolve
        run: |
          if [[ "${{ github.ref_name }}" =~ ^s[0-9] ]]; then
            echo "image=${{ env.REGISTRY }}/${{ github.repository_owner }}/emailflare-inbox-staging" >> $GITHUB_OUTPUT
            echo "is_staging=true" >> $GITHUB_OUTPUT
          else
            echo "image=${{ env.REGISTRY }}/${{ github.repository_owner }}/emailflare-inbox" >> $GITHUB_OUTPUT
            echo "is_staging=false" >> $GITHUB_OUTPUT
          fi

      - uses: docker/setup-qemu-action@v3

      - uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract Docker metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ steps.resolve.outputs.image }}
          tags: |
            type=semver,pattern=v{{version}},enable=${{ steps.resolve.outputs.is_staging == 'false' }}
            type=semver,pattern=v{{major}}.{{minor}},enable=${{ steps.resolve.outputs.is_staging == 'false' }}
            type=raw,value=latest,enable=${{ github.ref_type == 'tag' && steps.resolve.outputs.is_staging == 'false' }}
            type=raw,value=${{ github.ref_name }},enable=${{ steps.resolve.outputs.is_staging == 'true' }}

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile.email-inbox
          platforms: linux/amd64,linux/arm64
          push: ${{ github.ref_type == 'tag' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            MESAHUB_CORE_VERSION=trunk
          cache-from: type=gha,scope=inbox
          cache-to: type=gha,mode=max,scope=inbox

