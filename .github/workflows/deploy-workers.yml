name: Deploy Cloudflare Workers

# Deploys the unified EmailFlare Worker (apps/dashboard).
#
# Trigger manually via "Run workflow". Cloudflare resources (D1, KV, R2, Queue,
# Durable Object) and secrets must already exist. This workflow builds the
# vinext app and deploys the generated Worker.
#
# Required repository secrets:
#   CLOUDFLARE_API_TOKEN
#   CLOUDFLARE_ACCOUNT_ID

on:
    workflow_dispatch:

env:
    CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
    CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

jobs:
    deploy:
        name: Deploy emailflare
        runs-on: ubuntu-latest
        steps:
            - uses: actions/checkout@v7

            - name: Enable Corepack
              run: corepack enable

            - uses: actions/setup-node@v7
              with:
                  node-version: 22
                  cache: pnpm
                  cache-dependency-path: pnpm-lock.yaml

            - name: Install workspace dependencies
              run: pnpm install --frozen-lockfile

            - name: Write production Wrangler override
              working-directory: apps/dashboard
              env:
                  WRANGLER_PRODUCTION_CONFIG: ${{ secrets.WRANGLER_PRODUCTION_CONFIG }}
              run: |
                  if [ -z "$WRANGLER_PRODUCTION_CONFIG" ]; then
                    echo "Set the WRANGLER_PRODUCTION_CONFIG secret to the contents of wrangler.production.jsonc"
                    exit 1
                  fi
                  printf '%s\n' "$WRANGLER_PRODUCTION_CONFIG" > wrangler.production.jsonc

            - name: Build, migrate, and deploy
              working-directory: apps/dashboard
              run: pnpm run deploy
