name: Deploy Cloudflare Workers

# Deploys the unified EmailFlare Worker (apps/web).
#
# Trigger manually via "Run workflow". Cloudflare resources (D1, KV, R2, Queue,
# Durable Object) and secrets must already exist. This workflow builds the
# vinext app and deploys the generated Worker.
#
# Required repository secrets:
#   CLOUDFLARE_API_TOKEN
#   CLOUDFLARE_ACCOUNT_ID

on:
    workflow_dispatch:

env:
    CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
    CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

jobs:
    deploy:
        name: Deploy emailflare
        runs-on: ubuntu-latest
        steps:
            - uses: actions/checkout@v4

            - name: Enable Corepack
              run: corepack enable

            - uses: actions/setup-node@v4
              with:
                  node-version: 22
                  cache: pnpm
                  cache-dependency-path: pnpm-lock.yaml

            - name: Install workspace dependencies
              run: pnpm install --frozen-lockfile

            - name: Build, migrate, and deploy
              working-directory: apps/web
              run: pnpm run deploy
