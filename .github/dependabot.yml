# Dependabot opens one PR per dependency per directory by default. With 13
# workspace packages that turned one weekly run into ~46 PRs for a dozen
# distinct bumps (see #187). Each ecosystem below is a single entry covering
# all its directories, minor/patch bumps are grouped per dependency across
# directories, and majors that need a real migration are ignored so they can
# be upgraded deliberately instead of reappearing every Monday.
version: 2
updates:
    # ── npm (pnpm workspace) ─────────────────────────────────────────────────
    - package-ecosystem: "npm"
      directories:
          - "/"
          - "/packages/*"
          - "/services/*"
          - "/scripts"
      schedule:
          interval: "weekly"
          day: "monday"
      open-pull-requests-limit: 5
      versioning-strategy: "increase"
      cooldown:
          default-days: 7
      groups:
          # One PR per dependency across every workspace directory, for
          # minor and patch bumps. Majors fall through to individual PRs.
          npm-minor-patch:
              patterns: ["*"]
              update-types: ["minor", "patch"]
              group-by: "dependency-name"
      ignore:
          # Majors that require code changes, not just a version bump.
          # Upgrade these on purpose, one at a time.
          - dependency-name: "zod"
            update-types: ["version-update:semver-major"]
          - dependency-name: "@types/node"
            update-types: ["version-update:semver-major"]
          - dependency-name: "typescript"
            update-types: ["version-update:semver-major"]
          - dependency-name: "vite"
            update-types: ["version-update:semver-major"]
          - dependency-name: "lucide-react"
            update-types: ["version-update:semver-major"]
          - dependency-name: "jose"
            update-types: ["version-update:semver-major"]
          - dependency-name: "@cloudflare/workers-types"
            update-types: ["version-update:semver-major"]

    # ── Docker images ─────────────────────────────────────────────────────────
    - package-ecosystem: "docker"
      directories:
          - "/deploy/docker"
          - "/infra"
          - "/services/*"
      schedule:
          interval: "weekly"
          day: "monday"
      open-pull-requests-limit: 5
      cooldown:
          default-days: 7
      groups:
          docker-all:
              patterns: ["*"]

    # ── GitHub Actions ────────────────────────────────────────────────────────
    - package-ecosystem: "github-actions"
      directory: "/"
      schedule:
          interval: "weekly"
          day: "monday"
      open-pull-requests-limit: 5
      groups:
          actions-all:
              patterns: ["*"]
