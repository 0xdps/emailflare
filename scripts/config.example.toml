# emailflare configuration
# ─────────────────────────────────────────────────────────────────────────────
# Copy this file to config.toml, fill in your values, then run:
#   just setup
#
# Lines starting with # are comments. Leave a value blank ("") to be prompted
# interactively when running the setup script.

[deploy]
# D1 database name (default: emailflare). Change only if you need a custom name.
database_name = "emailflare"

[secrets]
# Password for the admin dashboard. Use a strong random string.
admin_token = ""

# Secret used to sign session JWTs. Must be 32+ characters.
# Generate one: openssl rand -hex 32
session_secret = ""

# Cloudflare API token used at *runtime* to send emails via the CF Email API.
# Required permissions: Email Routing (Edit), Zone (Read), DNS (Edit)
cf_api_token = ""

# Your Cloudflare account ID (stored as a runtime secret).
cf_account_id = ""

# Full URL of the worker (admin UI is served from the same origin).
# You'll know this after the first deploy — re-run setup to set it.
# e.g. https://emailflare-api-worker.YOUR-ACCOUNT.workers.dev
admin_origin = ""

# Public URL of the Email API worker, used to build one-click unsubscribe links
# (List-Unsubscribe headers). Same as admin_origin in most deployments.
# e.g. https://emailflare-api-worker.YOUR-ACCOUNT.workers.dev
public_url = ""

# ─────────────────────────────────────────────────────────────────────────────
# Inbox Worker  (deploy-inbox.mjs / just deploy-inbox)
# Reuses [deploy].database_name, [secrets].session_secret, cf_api_token,
# and cf_account_id — only VAPID keys are inbox-specific.
# ─────────────────────────────────────────────────────────────────────────────
[inbox]
# VAPID keys for Web Push notifications.
# Generate: npx web-push generate-vapid-keys
vapid_public_key  = ""
vapid_private_key = ""

# Public URL of the inbox worker, used to build one-click unsubscribe links.
# e.g. https://emailflare-inbox-worker.YOUR-ACCOUNT.workers.dev
public_url = ""

# Worker name used as the Email Routing catch-all destination when an inbox is
# created. Defaults to emailflare-inbox-worker.
inbox_worker_name = "emailflare-inbox-worker"

# ─────────────────────────────────────────────────────────────────────────────
# Inbox Server  (deploy-inbox-standalone.mjs / just deploy-inbox-standalone)
# Standalone Node.js deployment. Uses Redis + MesaHub instead of CF D1/KV/Queue.
# Reuses [secrets].session_secret, cf_api_token, cf_account_id.
# ─────────────────────────────────────────────────────────────────────────────
[inbox-server]
# MesaHub database URL.
# Use mh://local/inbox to start an embedded server in the same container.
# Use mh://apikey@host[:port]/inbox for an external MesaHub instance.
mesahub_url = "mh://local/inbox"

# Redis connection URL (used for rate limiting and BullMQ job queue).
redis_url = "redis://localhost:6379"

# Shared secret between inbox-bridge (CF Worker) and inbox-server.
# Generate: openssl rand -hex 32
webhook_secret = ""

# Public HTTPS URL of this inbox-server (used by inbox-bridge).
# e.g. https://inbox.example.com
inbox_server_url = ""

# Cloudflare R2 credentials (S3-compatible API) for attachment storage.
# Get these from the Cloudflare dashboard under R2 → Manage R2 API tokens.
r2_account_id       = ""
r2_access_key_id    = ""
r2_secret_access_key = ""
r2_bucket_name      = "emailflare-inbox-attachments"

